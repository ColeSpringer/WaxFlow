name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Nothing here writes to the repository. Cache and artifact uploads use the
# runtime token, not this one.
permissions:
  contents: read

jobs:
  # Long fuzz soak over every native fuzz target: 10 minutes per target
  # nightly versus the 45-second smoke in ci.yml. The list is 53 targets,
  # about 9 hours of fuzzing, and a hosted job dies at 6 hours, so it is
  # sharded: scripts/fuzz.sh discovers every target and FUZZ_SHARD=k/N runs
  # every Nth one, so the six shards cover the list once at about 90 minutes
  # each. Add a shard once a shard holds 24 targets: that is 4 hours of
  # fuzzing against the 5-hour timeout. New Fuzz* functions are picked up
  # automatically. scripts/fuzz.sh
  # fails the job only on a real crasher (a reproducer written under
  # testdata/fuzz), not on Go's benign end-of-run "context deadline
  # exceeded"; a real finding is echoed into this log and uploaded below so
  # it survives the ephemeral runner. The upload runs on a timeout too,
  # since a cancelled job skips failure() steps.
  fuzz-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: fuzz every target in this shard for 10 minutes
        run: bash scripts/fuzz.sh 10m
        env:
          FUZZ_SHARD: ${{ matrix.shard }}/6
      - name: upload fuzz logs and any reproducers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-soak-findings-${{ matrix.shard }}
          path: |
            fuzz-logs/
            **/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 14

  # The full suite with the differential oracle and conformance vectors
  # required, so a broken comparison cannot hide behind a skip. The non-race
  # run enforces the oracles (all single-goroutine numeric); the race pass
  # (whole tree, heavy numeric suites self-skip) covers the concurrent code.
  # ubuntu-24.04 on purpose. ci.yml's differential job and the dev box run
  # 26.04's ffmpeg 8.0.1; this one runs 24.04's 6.1.1, the older oracle the
  # version-keyed skips in the codec tests exist for (codec/wmavoice's
  # narrowedRuns is one). Nothing else exercises those skips, so a wrong one
  # would pass everywhere else.
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg flac wavpack
      # The cached tools are binaries for one image's glibc; ci.yml's
      # differential job says why the key reads the image from os-release.
      - id: image
        run: echo "id=$(. /etc/os-release && echo "$ID-$VERSION_ID")-$(uname -m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            testdata/vectors
            testdata/tools
          key: vectors-${{ steps.image.outputs.id }}-${{ hashFiles('internal/testutil/vectors.go', 'Makefile') }}
      - run: make verify-vectors
      - run: make ape-tools
      # The Musepack reference tools: both encoders the format has ever had,
      # the reference decoder's float output and the repacker and cutter, built
      # from the pinned tarballs the same way.
      - run: make mpc-tools
      # libopus's opus_demo, the reference decoder behind the codec/opus
      # interop tests.
      - run: make opus-tools
      - run: WAXFLOW_REQUIRE_FFMPEG=1 WAXFLOW_REQUIRE_FLAC=1 WAXFLOW_REQUIRE_WAVPACK=1 WAXFLOW_REQUIRE_MAC=1 WAXFLOW_REQUIRE_MPC=1 WAXFLOW_REQUIRE_OPUS_TOOLS=1 WAXFLOW_REQUIRE_VECTORS=1 go test -count=1 -timeout 30m ./...
      # -count=1 so the scheduled soak actually re-executes: without it the
      # cached GOCACHE (restored by setup-go) short-circuits an unchanged tree.
      - run: GOFLAGS=-count=1 make test-race

  # The browser column of the client matrix, end to end: a live daemon
  # over a generated library, the committed /demo page, headless Chromium
  # via Playwright driving every hls.js and progressive cell
  # (scripts/client-e2e.mjs; docs/client-matrix.md).
  client-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      # The dev box's Node major, so a failure here reproduces with a plain
      # `make client-e2e` there.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install playwright && npx playwright install --with-deps chromium
      - run: make client-e2e

  # Codec/DSP throughput watch: run the benchmarks, compare against the
  # previous night's numbers with benchstat (carried via the cache), and
  # publish both as artifacts. Informational: runner performance varies,
  # so regressions are triaged by a human against the floors in
  # docs/quality-gates.md rather than failing the job on noise.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - uses: actions/cache@v6
        with:
          path: bench-baseline.txt
          key: bench-baseline-${{ github.run_id }}
          restore-keys: bench-baseline-
      - run: go install golang.org/x/perf/cmd/benchstat@latest
      - run: make bench | tee bench-current.txt
      - name: compare against the previous night
        run: |
          if [ -f bench-baseline.txt ]; then
            benchstat bench-baseline.txt bench-current.txt | tee benchstat.txt
          else
            echo "no baseline yet; tonight's run becomes it" | tee benchstat.txt
          fi
          cp bench-current.txt bench-baseline.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-nightly
          path: |
            bench-current.txt
            benchstat.txt

  # The long streaming soak (goroutine/heap leak watch), sustained load,
  # and TTFA percentile checks (server/load_soak_test.go). Durations are
  # trimmed to the runner: the leak watch needs sustained traffic, not a
  # specific wall-clock length.
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - run: make soak
        env:
          WAXFLOW_SOAK_DURATION: 20m
          WAXFLOW_LOAD_DURATION: 3m

  # Encoder-quality gates: score our lossy encoders against the reference
  # baselines (Shine for MP3, ffmpeg's native aac for AAC and libvorbis for
  # Vorbis via the ODG-proxy; libopus for Opus via the reference
  # opus_demo/opus_compare built from the pinned source), enforce the
  # docs/quality-gates.md gates, and upload the HTML reports. libshine and
  # libvorbis (encoder and decoder both) ship in Ubuntu's ffmpeg build; the
  # libopus tools are built by `make opus-tools` and cached alongside the
  # pinned corpus. make -k carries on past a failing gate, so every gate
  # still reports. ubuntu-26.04 is pinned because the baselines are ffmpeg
  # build options and versions, and 26.04's are the measured ones.
  encoder-quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Keyed on the image for the reason the differential job gives.
      - id: image
        run: echo "id=$(. /etc/os-release && echo "$ID-$VERSION_ID")-$(uname -m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            testdata/vectors
            testdata/tools
          key: quality-${{ steps.image.outputs.id }}-${{ hashFiles('internal/testutil/vectors.go', 'Makefile') }}
      - run: go run ./internal/testutil/cmd/vectorfetch opus/corpus/ opus/speech/
      - run: make opus-tools
      - run: make -k encoder-quality QUALITY_REPORT=quality-report.html AAC_QUALITY_REPORT=aac-quality-report.html HEAAC_QUALITY_REPORT=heaac-quality-report.html HEAACV2_QUALITY_REPORT=heaacv2-quality-report.html VORBIS_QUALITY_REPORT=vorbis-quality-report.html OPUS_QUALITY_REPORT=opus-quality-report.html OPUS_SPEECH_QUALITY_REPORT=opus-speech-quality-report.html
      - name: upload the encoder-quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: encoder-quality-report
          path: |
            quality-report.html
            aac-quality-report.html
            heaac-quality-report.html
            heaacv2-quality-report.html
            vorbis-quality-report.html
            opus-quality-report.html
            opus-speech-quality-report.html
          if-no-files-found: warn
