name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository. Cache and artifact uploads use the
# runtime token, not this one.
permissions:
  contents: read

# A pull request's superseded runs are cancelled by its next push. Pushes to
# main are keyed by commit, so they never cancel each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # One pass per OS, no double-run: the whole-tree race pass on ubuntu (races
  # are caught here), and the non-race functional suite on macOS for
  # portability. Linux's enforcing non-race run with the ffmpeg/vector oracles
  # is the differential job below, so the ubuntu leg does not repeat a plain
  # non-race pass, and the ~10x-cost macOS runner skips the race build.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - run: make fmt-check
      - run: make vet
      - run: go build ./...
      - name: whole-tree race pass (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: make test-race
      - name: non-race functional pass (macOS portability)
        if: matrix.os == 'macos-latest'
        run: make test

  # source's Windows-only paths (the Win32 codes a failing drive or share
  # reports, the directory semantics its tests skip around) and the daemon's
  # root sweep and doctor rows, on real Windows.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - run: go test ./source/
      - name: cli root tests
        working-directory: cli
        shell: bash
        run: go test -run '^Test(RemountSweep|RemountStopIsBounded|BuildServerConfig(ToleratesMissingRoot|LogsNoRootMounted|CleanupStopsTheSweep)|ReloadLogsUnmountedRoots|Doctor(ReportsEachRoot|FailsOnMissingRoot)|SignNamesAnUnmountedRootsPath)$' .

  depcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - run: make depcheck

  # The nested modules: ./... at the root stops at their go.mod
  # boundaries, so each builds and tests here. cli carries the cobra
  # CLI plus the waxlabel mapper, oracletest the third-party-oracle
  # tests that keep the root module's require block empty, and
  # examples/catalogcli the out-of-prefix canary over the cli.Flavor
  # seam (its module path sits outside the waxflow prefix, so it is the
  # only thing here that fails if that seam widens to an internal type).
  nested-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - run: make test-cli
      - run: make test-oracle
      - run: make test-example
      - run: make build

  # The 32-bit word size, which no release target has and every other job
  # therefore misses. Go's int is 32 bits there, so a uint32 field read into an
  # int wraps and a 2^32 constant stops compiling; the whole tree had stopped
  # building for 386 before anyone ran it. vet is what covers the test files,
  # which go build does not compile, so the target runs both.
  word-size:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - run: make test-386

  cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: build all release targets
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -trimpath ./...
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -C cli -trimpath ./...
            echo "ok $target"
          done

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # .go-version is the toolchain pin setup-go reads in every job, and the
      # image builds FROM the same release.
      - id: go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"
      - name: build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci
            GO_VERSION=${{ steps.go.outputs.version }}

  # ffmpeg is a TEST ORACLE only, never a runtime dependency.
  # WAXFLOW_REQUIRE_FFMPEG=1, WAXFLOW_REQUIRE_FLAC=1,
  # WAXFLOW_REQUIRE_WAVPACK=1, WAXFLOW_REQUIRE_MAC=1, WAXFLOW_REQUIRE_MPC=1
  # and WAXFLOW_REQUIRE_OPUS_TOOLS=1 escalate the oracle tests' self-skips to
  # hard failures on this job, and WAXFLOW_REQUIRE_VECTORS=1 does the same for
  # the SHA-256-pinned conformance vectors (cached across runs, keyed by the
  # pin list). The run is non-race: this job enforces the
  # differential/conformance oracles (all single-goroutine numeric), and the
  # concurrency race coverage is the separate `make test-race` pass in the
  # test job. The Opus conformance suite runs here too (it self-skips only
  # under -race, so a non-race run exercises it in-line).
  #
  # Pinned to ubuntu-26.04 rather than ubuntu-latest: apt's ffmpeg is the
  # oracle and its version is part of every measured bound. 26.04 ships
  # 8.0.1, the build the figures in docs/notes were measured on. The nightly
  # differential job runs 24.04's 6.1.1, the older oracle the version-keyed
  # skips in the codec tests (testutil.FFmpegAtLeast) exist for, so those stay
  # checked too. Moving a label is an oracle change, not a runner upgrade.
  differential:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg flac wavpack
      # testdata/tools is cached beside the vectors so the reference tools
      # below are compiled once per pin rather than on every push; each
      # recipe is a no-op when its binaries are already there. Those binaries
      # need the glibc of the image that built them, so the key names the
      # image. It is read from os-release because an expression cannot see the
      # runner's own ImageOS variable.
      - id: image
        run: echo "id=$(. /etc/os-release && echo "$ID-$VERSION_ID")-$(uname -m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            testdata/vectors
            testdata/tools
          key: vectors-${{ steps.image.outputs.id }}-${{ hashFiles('internal/testutil/vectors.go', 'Makefile') }}
      - run: make verify-vectors
      # No distribution packages the Monkey's Audio console tool and ffmpeg
      # has no APE encoder, so the only APE encoder there is gets built from
      # the pinned SDK source here.
      - run: make ape-tools
      # The Musepack reference tools: both encoders the format has ever had,
      # the reference decoder's float output and the repacker and cutter, built
      # from the pinned tarballs the same way.
      - run: make mpc-tools
      # libopus's opus_demo: the reference decoder behind the SILK and mode
      # interop tests in codec/opus, which self-skip without it.
      - run: make opus-tools
      - run: WAXFLOW_REQUIRE_FFMPEG=1 WAXFLOW_REQUIRE_FLAC=1 WAXFLOW_REQUIRE_WAVPACK=1 WAXFLOW_REQUIRE_MAC=1 WAXFLOW_REQUIRE_MPC=1 WAXFLOW_REQUIRE_OPUS_TOOLS=1 WAXFLOW_REQUIRE_VECTORS=1 go test -timeout 30m ./...

  # 45s per fuzz target; nightly.yml runs the long soak. scripts/fuzz.sh
  # finds every native Fuzz* target, and FUZZ_SHARD=k/N runs every Nth one,
  # so the four shards cover the list once at about a quarter of the wall
  # time each. It classifies outcomes so only a real crasher fails the job
  # (not Go's end-of-run timeout artifact); a finding is echoed into the log
  # and uploaded as an artifact. The upload runs on a timeout too, since a
  # cancelled job skips failure() steps.
  fuzz-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: fuzz every target in this shard for 45 seconds
        run: bash scripts/fuzz.sh 45s
        env:
          FUZZ_SHARD: ${{ matrix.shard }}/4
      - name: upload fuzz logs and any reproducers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-short-findings-${{ matrix.shard }}
          path: |
            fuzz-logs/
            **/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 14
