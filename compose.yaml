# Standalone deployment:
#
#   grep -qs '^WAXFLOW_API_KEYS=' .env || echo "WAXFLOW_API_KEYS=$(openssl rand -hex 24)" >> .env
#   echo "WAXFLOW_LIBRARY=$HOME/Music" >> .env
#   docker compose up -d
#
# compose reads .env on every run, so the key survives restarts. The library
# folder (default ./library) is served as the root `lib`; signed URLs and the
# transcode cache persist in the named volumes.
#
# pid:<id> sources need the host that answers them: set WAXFLOW_PID_LOOKUP_URL
# (and WAXFLOW_PID_LOOKUP_KEY) in an override file or the environment; the
# `pid:` lookup host section of docs/api.md is the contract. A build that
# injects a catalog resolver instead (cli.Flavor) adds its image and
# WAXFLOW_CATALOG_DB in that override:
#
#   docker compose -f compose.yaml -f your-override.yaml up -d
#
# Mount such a catalog read-write even though a resolver opens it read-only: a
# SQLite catalog's WAL readers write read-marks into the -shm sidecar, so the
# daemon's UID (10001) needs write access to the -wal/-shm files beside it.
#
# Exposure note: this widens the listen address to 0.0.0.0 inside
# the container. Put TLS in front (native tlsCert/tlsKey or a terminating
# reverse proxy) before exposing the published port beyond your LAN.
services:
  waxflow:
    image: ghcr.io/colespringer/waxflow:latest
    # Every `up` pulls, so a published image replaces a local build. Until a
    # release exists the pull fails and compose uses an image built from this
    # checkout, building it on the first run (or with --build).
    pull_policy: always
    build: .
    environment:
      WAXFLOW_ADDR: 0.0.0.0:4418
      WAXFLOW_ROOTS: lib=/library
      # Fail-closed rule: a non-loopback listen address requires API keys
      # (or an explicit WAXFLOW_ALLOW_UNAUTHENTICATED=true, LAN-only).
      WAXFLOW_API_KEYS: ${WAXFLOW_API_KEYS:?set WAXFLOW_API_KEYS (comma-separated) or override allowUnauthenticated}
    ports:
      - "4418:4418"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - waxflow-data:/data
      - waxflow-cache:/cache
      - ${WAXFLOW_LIBRARY:-./library}:/library:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  waxflow-data:
  waxflow-cache:
